<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>The Red Archive</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ============================================================
   BASIC
   ============================================================ */

html {
    background: #c0c0c0;
}

body {
    margin: 0;
    padding: 0;

    background: #c0c0c0;

    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;
}

a {
    color: #0000cc;
    text-decoration: underline;
    cursor: pointer;
}

a:visited {
    color: #551a8b;
}


/* ============================================================
   MAIN SITE
   ============================================================ */

.site {
    width: 760px;

    margin: 15px auto;

    background: #fff;

    border: 1px solid #000;

    box-shadow:
        2px 2px 0 #555;
}


/* ============================================================
   HEADER
   ============================================================ */

.header {
    position: relative;

    background: #8b0000;

    color: #fff;

    padding:
        8px
        10px
        7px
        10px;

    border-bottom:
        3px solid
        #400000;
}

.header h1 {
    margin: 0;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-size: 30px;

    letter-spacing: -1px;
}

.header p {
    margin:
        2px
        0
        0
        0;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-size: 12px;
}

.user-status {
    position: absolute;

    right: 10px;
    top: 10px;

    font-size: 11px;
}


/* ============================================================
   NAV
   ============================================================ */

.nav {
    background: #c0c0c0;

    border-bottom:
        1px solid
        #000;

    padding: 4px;
}

.nav a {
    display: inline-block;

    color: #000;

    text-decoration: none;

    background: #d4d0c8;

    border-top:
        2px solid
        #fff;

    border-left:
        2px solid
        #fff;

    border-right:
        2px solid
        #404040;

    border-bottom:
        2px solid
        #404040;

    padding:
        3px
        8px;

    margin-right: 3px;

    font-size: 12px;
}

.nav a:active {
    border-top:
        2px solid
        #404040;

    border-left:
        2px solid
        #404040;

    border-right:
        2px solid
        #fff;

    border-bottom:
        2px solid
        #fff;
}


/* ============================================================
   CONTENT
   ============================================================ */

.content {
    padding: 12px;

    min-height: 450px;
}


/* ============================================================
   BOXES
   ============================================================ */

.box {
    border:
        1px solid
        #808080;

    margin-bottom: 12px;
}

.box-title {
    background: #8b0000;

    color: #fff;

    font-weight: bold;

    padding:
        4px
        6px;

    border-bottom:
        1px solid
        #000;
}

.box-body {
    padding: 9px;
}


/* ============================================================
   HOME
   ============================================================ */

.welcome-title {
    color: #8b0000;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-size: 24px;

    margin:
        0
        0
        6px
        0;
}


/* ============================================================
   MESSAGES
   ============================================================ */

.notice {
    background: #ffffcc;

    border:
        1px solid
        #999900;

    padding: 7px;

    margin-bottom: 10px;
}

.error {
    background: #ffcccc;

    border:
        1px solid
        #990000;

    padding: 7px;

    margin-bottom: 10px;
}

.success {
    background: #ccffcc;

    border:
        1px solid
        #008000;

    padding: 7px;

    margin-bottom: 10px;
}


/* ============================================================
   ARCHIVE LIST
   ============================================================ */

.archive-entry {
    display: block;

    background: #fff;

    border:
        1px solid
        #808080;

    margin-bottom: 10px;

    cursor: pointer;

    box-shadow:
        1px 1px 0
        #aaa;
}

.archive-entry:hover {
    background: #f3f3f3;

    border-color:
        #555;
}

.archive-entry-header {
    background: #e0e0e0;

    border-bottom:
        1px solid
        #808080;

    padding:
        5px
        7px;
}

.archive-entry-title {
    color: #8b0000;

    font-size: 15px;

    font-weight: bold;
}

.archive-entry-meta {
    color: #555;

    font-size: 11px;

    margin-top: 2px;
}

.archive-entry-body {
    padding:
        8px
        9px;

    color: #222;

    line-height: 1.4;
}

.archive-entry-footer {
    background: #eeeeee;

    border-top:
        1px solid
        #cccccc;

    padding:
        4px
        7px;

    font-size: 11px;

    color: #555;
}

.archive-entry-footer .read-link {
    float: right;

    color: #0000cc;

    font-weight: bold;
}


/* ============================================================
   FULL POST
   ============================================================ */

.full-post {
    border:
        1px solid
        #808080;

    margin-bottom: 12px;
}

.full-post-header {
    background: #e0e0e0;

    border-bottom:
        1px solid
        #808080;

    padding: 7px;
}

.full-post-title {
    color: #8b0000;

    font-size: 19px;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-weight: bold;
}

.full-post-meta {
    color: #555;

    font-size: 11px;

    margin-top: 4px;
}

.full-post-body {
    padding: 11px;

    white-space: pre-wrap;

    word-wrap: break-word;

    line-height: 1.45;
}


/* ============================================================
   ATTACHMENTS
   ============================================================ */

.post-attachment {
    border-top:
        1px solid
        #ccc;

    padding: 8px;
}

.attachment-image {
    display: block;

    max-width: 100%;

    max-height: 600px;

    border:
        1px solid
        #808080;

    margin-top: 7px;
}

.attachment-file {
    display: inline-block;

    padding:
        5px
        8px;

    background: #d4d0c8;

    border-top:
        2px solid
        #fff;

    border-left:
        2px solid
        #fff;

    border-right:
        2px solid
        #404040;

    border-bottom:
        2px solid
        #404040;

    text-decoration: none;

    color: #000;
}

.file-info {
    font-size: 11px;

    color: #555;

    margin-top: 4px;
}


/* ============================================================
   SOCIAL BAR
   ============================================================ */

.post-social {
    background: #eee;

    border-top:
        1px solid
        #ccc;

    border-bottom:
        1px solid
        #ccc;

    padding: 6px 7px;
}

.like-button {
    min-width: 90px;
}

.like-button.liked {
    color: #8b0000;

    font-weight: bold;
}


/* ============================================================
   COMMENTS
   ============================================================ */

.comments {
    background: #f7f7f7;

    border-top:
        1px solid
        #ccc;

    padding: 9px;

    margin-top: 8px;
}

.comments-title {
    color: #8b0000;

    font-weight: bold;

    margin-bottom: 7px;
}

.comment {

        1px solid
        #b0b0b0;

    margin-bottom: 7px;

    background: #fff;
}

.comment-header {
    background: #e4e4e4;

    border-bottom:
        1px solid

    padding:
        4px
        6px;

    font-size: 11px;
}

.comment-body {
    padding: 7px;

    white-space: pre-wrap;

    word-wrap: break-word;
}

.comment-actions {
    border-top:
        1px solid
        #ddd;

    padding:
        3px
        6px;

    background: #eee;

    text-align: right;
}

.comment-form {
    margin-top: 8px;
}

.comment-form textarea {
    width: 100%;

    max-width: none;

    height: 70px;
}

.login-to-comment {
    margin-top: 8px;

    font-size: 11px;
}


/* ============================================================
   POST ACTIONS
   ============================================================ */

.post-actions {
    background: #eee;

    border-top:
        1px solid
        #ccc;

    padding:
        4px
        7px;

    text-align: right;
}

button.danger {
    color: #990000;
}


/* ============================================================
   FORMS
   ============================================================ */

input[type="text"],
input[type="email"],
input[type="password"],
textarea {

    box-sizing: border-box;

    border:
        1px solid
        #000;

    background: #fff;

    padding: 3px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;
}

input[type="text"],
input[type="email"],
input[type="password"] {
    width: 310px;
}

textarea {
    width: 100%;

    max-width: 650px;

    height: 180px;

    resize: vertical;
}

input[type="file"] {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;

    width: 100%;

    max-width: 650px;
}


/* ============================================================
   BUTTONS
   ============================================================ */

input[type="submit"],
button {

    background: #d4d0c8;

    color: #000;

    border-top:
        2px solid
        #fff;

    border-left:
        2px solid
        #fff;

    border-right:
        2px solid
        #404040;

    border-bottom:
        2px solid
        #404040;

    padding:
        3px
        12px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;

    cursor: pointer;
}

input[type="submit"]:active,
button:active {

    border-top:
        2px solid
        #404040;

    border-left:
        2px solid
        #404040;

    border-right:
        2px solid
        #fff;

    border-bottom:
        2px solid
        #fff;
}


/* ============================================================
   MISC
   ============================================================ */

hr {
    border: 0;

    border-top:
        1px solid
        #999;

    margin:
        12px
        0;
}

.small {
    font-size: 11px;
}

.red {
    color: #8b0000;
}

.hidden {
    display: none !important;
}

.loading {
    text-align: center;

    padding: 30px;

    font-family:
        "Times New Roman",
        Times,
        serif;

}

.counter {

        "Courier New",
        monospace;

    background: #000;

    color: #00ff00;

    border:
        1px solid
        #555;

    padding:
        2px
        5px;

    display: inline-block;
}

.member-row {
    border-bottom:
        1px dotted
        #999;

    padding:
        5px
        2px;
}

.member-row:last-child {
    border-bottom: none;
}

.upload-warning {
    font-size: 11px;

    color: #660000;

    margin-top: 4px;

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 790px) {

    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {

    }

</style>

<script>


// ============================================================
// SUPABASE CONFIG
// ============================================================

const SUPABASE_URL =
    "https://kiexpjqaaoxsbiwcdtrf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1IGxAZM2xFVEfDd1GT8MzQ_JnPkhegd";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


// ============================================================
// CONSTANTS
// ============================================================

const MAX_FILE_SIZE =
    5 * 1024 * 1024;

const STORAGE_BUCKET =
    "archive-files";

let currentUser = null;
let currentProfile = null;


// ============================================================
// HELPERS
// ============================================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function truncateText(text, length = 100) {

    if (!text) {
        return "";
    }

    if (text.length <= length) {
        return text;
    }

    return text
        .substring(0, length)
        .trim() + "...";
}


function formatDate(value) {

    if (!value) {
        return "";
    }

    return new Date(value)
        .toLocaleString();
}


function formatFileSize(bytes) {

    if (
        bytes === null ||
        bytes === undefined
    ) {
        return "";
    }

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (
            (bytes / 1024).toFixed(1)
            + " KB"
        );
    }

    return (
        (bytes / 1024 / 1024).toFixed(2)
        + " MB"
    );
}


function showMessage(
    text,
    type = "success"
) {

    const area =
        document.getElementById(
            "messageArea"
        );

    area.innerHTML = `
        <div class="${type}">
            ${escapeHTML(text)}
        </div>
    `;

    window.scrollTo(
        0,
        0
    );

    setTimeout(
        () => {
            area.innerHTML = "";
        },
        5000
    );
}


// ============================================================
// AUTH
// ============================================================

async function updateAuthState() {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if (error) {

        console.error(
            "Auth error:",
            error
        );

        currentUser = null;
        currentProfile = null;

    } else {

        currentUser =
            data.user || null;
    }


    if (!currentUser) {

        currentProfile = null;

        document.getElementById(
            "userStatus"
        ).textContent =
            "Guest";


        document
            .getElementById(
                "guestLinks"
            )
            .classList
            .remove(
                "hidden"
            );


        document
            .getElementById(
                "memberLinks"
            )
            .classList
            .add(
                "hidden"
            );

        return;
    }


    const {
        data: profile,
        error: profileError
    } =
        await supabaseClient
            .from("profiles")
            .select("username")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if (profileError) {

        console.error(
            "Profile error:",
            profileError
        );

        currentProfile = null;

    } else {

        currentProfile =
            profile || null;
    }


    const username =
        currentProfile?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email ||
        "Member";


    document.getElementById(
        "userStatus"
    ).innerHTML =
        "Logged in as <b>" +
        escapeHTML(username) +
        "</b>";


    document
        .getElementById(
            "guestLinks"
        )
        .classList
        .add(
            "hidden"
        );


    document
        .getElementById(
            "memberLinks"
        )
        .classList
        .remove(
            "hidden"
        );
}

// HOME
// ============================================================

// ============================================================
// LOAD ARCHIVE CARDS
// ============================================================

async function loadArchiveCards(
    containerId,
    limit = null
) {

    const container =
        document.getElementById(
            containerId
        );


    let query =
        supabaseClient
            .from("posts")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (limit !== null) {

        query =
            query.limit(
                limit
            );
    }


    const {
        data,
        error
    } =
        await query;


    if (error) {

        console.error(
            "Archive error:",
            error
        );


        container.innerHTML = `
            <div class="error">
                Unable to load archive entries.
            </div>
        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML = `
            <div class="notice">
                The archive is currently empty.
            </div>
        `;

        return;
    }


    container.innerHTML =
        data
            .map(
                renderArchiveCard
            )
            .join("");


    await loadCardSocialData(
        data
    );
}


// ============================================================
// ARCHIVE CARD
// ============================================================

function renderArchiveCard(post) {

    return `

        <div
            class="archive-entry"
            onclick="openPost(${post.id})"
        >

            <div class="archive-entry-header">

                <div class="archive-entry-title">

                    [${String(
                        post.id
                    ).padStart(
                        5,
                        "0"
                    )}]

                    ${escapeHTML(
                        post.title
                    )}

                </div>


                <div class="archive-entry-meta">

                    Posted by

                    <b>
                        ${escapeHTML(
                            post.username
                        )}
                    </b>

                    -

                    ${escapeHTML(
                        formatDate(
                            post.created_at
                        )
                    )}

                </div>

            </div>


            <div class="archive-entry-body">

                ${escapeHTML(
                    truncateText(
                        post.content,
                        100
                    )
                )}

            </div>


            <div
                class="archive-entry-footer"
                id="card-social-${post.id}"
            >

                Loading...

                <span class="read-link">
                    Read Entry &gt;&gt;
                </span>

            </div>

        </div>
    `;
}


// ============================================================
// SOCIAL DATA FOR CARDS
// ============================================================

async function loadCardSocialData(posts) {

    const postIds =
        posts.map(
            post => post.id
        );


    const {
        data: likes,
        error: likesError
    } =
        await supabaseClient
            .from("likes")
            .select(
                "post_id"
            )
            .in(
                "post_id",
                postIds
            );


    const {
        data: comments,
        error: commentsError
    } =
        await supabaseClient
            .from("comments")
            .select(
                "post_id"
            )
            .in(
                "post_id",
                postIds
            );


    if (
        likesError ||
        commentsError
    ) {

        console.error(
            "Card social error:",
            likesError ||
            commentsError
        );

        return;
    }


    posts.forEach(
        post => {

            const likeCount =
                (likes || [])
                    .filter(
                        like =>
                            like.post_id ===
                            post.id
                    )
                    .length;


            const commentCount =
                (comments || [])
                    .filter(
                        comment =>
                            comment.post_id ===
                            post.id
                    )
                    .length;


            const element =
                document.getElementById(
                    "card-social-" +
                    post.id
                );


            if (!element) {
                return;
            }


            element.innerHTML = `

                ♥ ${likeCount}
                ${likeCount === 1 ? "Like" : "Likes"}

// ============================================================

// ============================================================

async function showSinglePost(id) {

    const app =
        document.getElementById(
            "app"
        );


    app.innerHTML = `

        <div class="box">

            <div class="box-title">
                Archive Record #${id}
            </div>

            <div class="box-body">

                <a href="#archive">
                    &lt;&lt; Back to Archive
                </a>

            </div>

        </div>


        <div id="singlePost">

            <div class="loading">
                Loading archive record...
            </div>

        </div>

    `;


    const {
        data: post,
        error
    } =
        await supabaseClient
            .from("posts")
            .select("*")
            .eq(
                "id",
                id
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Single post error:",
            error
        );


        document.getElementById(
            "singlePost"
        ).innerHTML = `

            <div class="error">
                Unable to load this archive entry.
            </div>

        `;

        return;
    }


    if (!post) {

        document.getElementById(
            "singlePost"
        ).innerHTML = `

            <div class="notice">

                Archive entry not found.

                <br><br>

                <a href="#archive">
                    Return to Archive
                </a>

            </div>

        `;

        return;
    }


    const {
        data: likes,
        error: likesError
    } =
        await supabaseClient
            .from("likes")
            .select(
                "id, user_id"
            )
            .eq(
                "post_id",
                id
            );


    const {
        data: comments,
        error: commentsError
    } =
        await supabaseClient
            .from("comments")
            .select("*")
            .eq(
                "post_id",
                id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (
        likesError ||
        commentsError
    ) {

        console.error(
            likesError ||
            commentsError
        );
    }


    const postLikes =
        likes || [];


    const postComments =
        comments || [];


    const userLiked =
        currentUser &&
        postLikes.some(
            like =>
                like.user_id ===
                currentUser.id
        );


    let attachmentHTML = "";


    if (
        post.attachment_path
    ) {

        const {
            data
        } =
            supabaseClient
                .storage
                .from(
                    STORAGE_BUCKET
                )
                .getPublicUrl(
                    post.attachment_path
                );


        const fileURL =
            data.publicUrl;


        if (
            post.attachment_type &&
            post.attachment_type.startsWith(
                "image/"
            )
        ) {

            attachmentHTML = `

                <div class="post-attachment">

                    <b>
                        Attachment:
                    </b>

                    <br>

                    <img
                        class="attachment-image"
                        src="${escapeHTML(
                            fileURL
                        )}"
                        alt="${escapeHTML(
                            post.attachment_name ||
                            "Image"
                        )}"
                    >


                    <div class="file-info">

                        ${escapeHTML(
                            post.attachment_name
                        )}

                        -

                        ${escapeHTML(
                            formatFileSize(
                                post.attachment_size
                            )
                        )}

                    </div>

                </div>

            `;

        } else {

            attachmentHTML = `

                <div class="post-attachment">

                    <b>
                        Attachment:
                    </b>

                    <br><br>

                    <a
                        class="attachment-file"
                        href="${escapeHTML(
                            fileURL
                        )}"
                        target="_blank"
                        rel="noopener"
                    >

                        Download

                        ${escapeHTML(
                            post.attachment_name ||
                            "file"
                        )}

                    </a>


                    <div class="file-info">

                        ${escapeHTML(
                            formatFileSize(
                                post.attachment_size
                            )
                        )}

                    </div>

                </div>

            `;
        }
    }


    const canDelete =
        currentUser &&
        currentUser.id ===
            post.user_id;


    document.getElementById(
        "singlePost"
    ).innerHTML = `

        <div class="full-post">

            <div class="full-post-header">

                <div class="full-post-title">

                    [${String(
                        post.id
                    ).padStart(
                        5,
                        "0"
                    )}]

                    ${escapeHTML(
                        post.title
                    )}

                </div>


                <div class="full-post-meta">

                    Posted by

                    <b>
                        ${escapeHTML(
                            post.username
                        )}
                    </b>

                    -

                    ${escapeHTML(
                        formatDate(
                            post.created_at
                        )
                    )}

                </div>

            </div>


            <div class="full-post-body">

                ${escapeHTML(
                    post.content
                )}

            </div>


            ${attachmentHTML}


            <div class="post-social">

                <button
                    class="like-button ${
                        userLiked
                        ? "liked"
                        : ""
                    }"
                    onclick="toggleLike(${post.id})"
                >

                    ${
                        userLiked
                        ? "♥ Liked"
                        : "♥ Like"
                    }

                </button>


                &nbsp;


                <b>
                    ${postLikes.length}
                </b>

                ${
                    postLikes.length === 1
                    ? "Like"
                    : "Likes"
                }

            </div>


            ${
                canDelete
                ?
                `
                    <div class="post-actions">

                        <button
                            class="danger"
                            onclick="deletePost(${post.id})"
                        >
                            Delete This Entry
                        </button>

                    </div>
                `
                :
                ""
            }


            <div class="comments">

                <div class="comments-title">

                    Comments
                    (${postComments.length})

                </div>


                ${
                    postComments.length === 0

                    ?

                    `
                        <div class="small">

                            No comments yet.

                            Be the first to comment.

                        </div>
                    `

                    :

                    postComments
                        .map(
                            renderComment
                        )
                        .join("")
                }


                ${
                    currentUser

                    ?

                    `

                        <form
                            class="comment-form"
                            onsubmit="submitComment(
                                event,
                                ${post.id},
                                true
                            )"
                        >

                            <textarea
                                id="comment-input-${post.id}"
                                maxlength="5000"
                                placeholder="Write a comment..."
                                required
                            ></textarea>

                            <br><br>

                            <input
                                type="submit"
                                value="Post Comment"
                            >

                        </form>

                    `

                    :

                    `

                        <div class="login-to-comment">

                            <a href="#login">
                                Log in
                            </a>

                            to like this entry
                            or leave a comment.

                        </div>

                    `
                }

            </div>

        </div>


        <p>

            <a href="#archive">
                &lt;&lt; Back to Archive
            </a>

        </p>

    `;
}

function renderComment(comment) {

    const canDelete =
        currentUser &&
        currentUser.id ===
            comment.user_id;


    return `

        <div class="comment">

            <div class="comment-header">

                <b>
                    ${escapeHTML(
                        comment.username
                    )}
                </b>

                -

                ${escapeHTML(
                    formatDate(
                        comment.created_at
                    )
                )}

            </div>


            <div class="comment-body">

                ${escapeHTML(
                    comment.content
                )}

            </div>


            ${
                canDelete

                ?

                `

                    <div class="comment-actions">

                        <button
                            class="danger"
                            onclick="deleteComment(
                                ${comment.id},
                                ${comment.post_id}
                            )"
                        >
                            Delete
                        </button>

                    </div>

                `

                :

                ""
            }

        </div>
    `;
}


// ============================================================

// ============================================================

async function toggleLike(postId) {

    if (!currentUser) {

        showMessage(
            "You must be logged in to like posts.",
            "error"
        );

        location.hash =
            "login";

        return;
    }


    const {
        data: existingLike,
        error: checkError
    } =
        await supabaseClient
            .from("likes")
            .select("id")
            .eq(
                "post_id",
                postId
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if (checkError) {

        console.error(
            "Like check error:",
            checkError
        );


        showMessage(
            "Could not update the like.",
            "error"
        );

        return;
    }


    if (existingLike) {

        const {
            error
        } =
            await supabaseClient
                .from("likes")
                .delete()
                .eq(
                    "id",
                    existingLike.id
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


        if (error) {

            console.error(
                "Unlike error:",
                error
            );


            showMessage(
                "Could not remove like.",
                "error"
            );

            return;
        }


    } else {

        const {
            error
        } =
            await supabaseClient
                .from("likes")
                .insert({

                    post_id:
                        postId,

                    user_id:
                        currentUser.id

                });


        if (error) {

            console.error(
                "Like error:",
                error
            );


            showMessage(
                "Could not like this post.",
                "error"
            );

            return;
        }
    }


    await showSinglePost(
        postId
    );
}


// ============================================================
// COMMENT
// ============================================================

async function submitComment(
    event,
    postId
) {

    event.preventDefault();


    if (!currentUser) {

        showMessage(
            "You must be logged in to comment.",
            "error"
        );

        return;
    }


    const textarea =
        document.getElementById(
            "comment-input-" +
            postId
        );


    const content =
        textarea.value.trim();


    if (!content) {

        return;
    }


    const username =
        currentProfile?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email ||
        "Unknown";


    const {
        error
    } =
        await supabaseClient
            .from("comments")
            .insert({

                post_id:
                    postId,

                user_id:
                    currentUser.id,

                username:
                    username,

                content:
                    content
            });


    if (error) {

        console.error(
            "Comment error:",
            error
        );


        showMessage(
            "Could not post comment: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Comment posted."
    );


    await showSinglePost(
        postId
    );
}

// ============================================================
// DELETE POST
// ============================================================

async function deletePost(id) {

    if (!currentUser) {
        return;
    }


    if (
        !confirm(
            "Delete this archive entry?"
        )
    ) {
        return;
    }


    const {
        data: post,
        error: postError
    } =
        await supabaseClient
            .from("posts")
            .select(
                "attachment_path"
            )
            .eq(
                "id",
                id
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if (postError) {

        console.error(
            postError
        );


        showMessage(
            "Could not find the post.",
            "error"
        );

        return;
    }


    if (
        post &&
        post.attachment_path
    ) {

        const {
            error:
                storageError
        } =
            await supabaseClient
                .storage
                .from(
                    STORAGE_BUCKET
                )
                .remove([
                    post.attachment_path
                ]);


        if (storageError) {

            console.error(
                "Storage delete error:",
                storageError
            );
        }
    }


    const {
        error
    } =
        await supabaseClient
            .from("posts")
            .delete()
            .eq(
                "id",
                id
            )
            .eq(
                "user_id",
                currentUser.id
            );


    if (error) {

        console.error(
            "Delete post error:",
            error
        );


        showMessage(
            "Could not delete the post.",
            "error"
        );

        return;
    }


    showMessage(
        "Archive entry deleted."
    );


    location.hash =
        "archive";
}

// REGISTER
// ============================================================

async function register(event) {

    event.preventDefault();


    const username =
        document
            .getElementById(
                "registerUsername"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;


    if (
        username.length < 3
    ) {

        showMessage(
            "Username must contain at least 3 characters.",
            "error"
        );

        return;
    }


    if (
        username.length > 30
    ) {

        showMessage(
            "Username must be 30 characters or less.",
            "error"
        );

        return;
    }


    if (
        password.length < 6
    ) {

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }


    const validUsername =
        /^[A-Za-z0-9_-]+$/;


    if (
        !validUsername.test(
            username
        )
    ) {

        showMessage(
            "Username may only contain letters, numbers, _ and -.",
            "error"
        );

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signUp({

                email:
                    email,

                password:
                    password,

                options: {

                    data: {

                        username:
                            username

                    }

                }

            });


    if (error) {

        console.error(
            "Register error:",
            error
        );


        showMessage(
            error.message,
            "error"
        );

        return;
    }


    if (
        data &&
        data.session
    ) {

        await updateAuthState();

        showMessage(
            "Account created successfully."
        );

        navigate("home");

    } else {

        showMessage(
            "Account created. Check your email to confirm your account."
        );

        navigate("login");
    }
}

// ============================================================
// SAFE FILE NAME
// ============================================================

function safeFileName(name) {

    return name
        .replace(
            /[^a-zA-Z0-9._(),!$@=;+\- ]/g,
            "_"
        )
        .replace(
            /\s+/g,
            "_"
        );
}


// ============================================================
// CREATE POST
// ============================================================

async function createPost(event) {

    event.preventDefault();


    const title =
        document
            .getElementById(
                "postTitle"
            )
            .value
            .trim();


    const content =
        document
            .getElementById(
                "postContent"
            )
            .value
            .trim();


    const file =
        document.getElementById(
            "postFile"
        ).files[0] ||
        null;


    if (
        !title ||
        !content
    ) {

        showMessage(
            "Please fill in both fields.",
            "error"
        );

        return;
    }


    if (
        file &&
        file.size >
            MAX_FILE_SIZE
    ) {

        showMessage(
            "The file is larger than 5 MB.",
            "error"
        );

        return;
    }


    let attachmentPath = null;
    let attachmentName = null;
    let attachmentType = null;
    let attachmentSize = null;


    if (file) {

        const cleanName =
            safeFileName(
                file.name
            );


        attachmentPath =
            currentUser.id +
            "/" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 10) +
            "_" +
            cleanName;


        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from(
                    STORAGE_BUCKET
                )
                .upload(
                    attachmentPath,
                    file,
                    {
                        cacheControl:
                            "3600",

                        contentType:
                            file.type ||
                            "application/octet-stream",

                        upsert:
                            false
                    }
                );


        if (uploadError) {

            console.error(
                "Upload error:",
                uploadError
            );


            showMessage(
                "Could not upload the file: " +
                uploadError.message,
                "error"
            );

            return;
        }


        attachmentName =
            file.name;

        attachmentType =
            file.type ||
            "application/octet-stream";

        attachmentSize =
            file.size;
    }


    const username =
        currentProfile?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email ||
        "Unknown";


    const {
        error
    } =
        await supabaseClient
            .from("posts")
            .insert({

                user_id:
                    currentUser.id,

                username:
                    username,

                title:
                    title,

                content:
                    content,

                attachment_path:
                    attachmentPath,

                attachment_name:
                    attachmentName,

                attachment_type:
                    attachmentType,

                attachment_size:
                    attachmentSize
            });


    if (error) {

        console.error(
            "Post error:",
            error
        );


        if (
            attachmentPath
        ) {

            await supabaseClient
                .storage
                .from(
                    STORAGE_BUCKET
                )
                .remove([
                    attachmentPath
                ]);
        }


        showMessage(
            "Could not submit post: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Your entry has been added to the archive."
    );


    navigate("archive");
}


// ============================================================
// MEMBERS
// ============================================================

async function showMembers() {

    const app =
        document.getElementById(
            "app"
        );


    app.innerHTML = `

        <div class="box">

            <div class="box-title">
                Members
            </div>

            <div class="box-body">
                Loading members...
            </div>

        </div>

    `;


    const boxBody =
        app.querySelector(
            ".box-body"
        );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "username, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Members error:",
            error
        );


        boxBody.innerHTML = `
            <div class="error">
                Could not load members.
            </div>
        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        boxBody.innerHTML =
            "No members found.";

        return;
    }


    boxBody.innerHTML = `

        <p>

            Registered members:

            <b>
                ${data.length}
            </b>

        </p>

        <hr>


        ${
            data
                .map(
                    member => `

                        <div
                            class="member-row"
                        >

                            <b>
                                ${escapeHTML(
                                    member.username
                                )}
                            </b>

                            <span class="small">

                                -

                                Joined

                                ${escapeHTML(
                                    formatDate(
                                        member.created_at
                                    )
                                )}

                            </span>

                        </div>
                    `
                )
                .join("")
        }

    `;
}

// ============================================================
// ROUTING
// ============================================================

function getRoute() {

    const hash =
        location.hash.substring(1);


    if (!hash) {
        return {
            type: "home"
        };
    }


    if (
        hash.startsWith(
            "post-"
        )
    ) {

        const id =
            hash.substring(
                5
            );


        if (
            /^\d+$/.test(id)
        ) {

            return {
                type: "post",
                id: Number(id)
            };

        }

    }


    return {
        type:
            hash.toLowerCase()
    };
}


async function navigate(route) {

    location.hash =
        route;
}


// ============================================================
// ROUTER
// ============================================================

async function renderRoute() {

    await updateAuthState();


    const route =
        getRoute();


    if (
        route.type ===
        "post"
    ) {

        await showSinglePost(
            route.id
        );

        return;
    }


    switch (
        route.type
    ) {

        case "home":

            await showHome();

            break;


        case "archive":

            await showArchive();

            break;


        case "members":

            await showMembers();

            break;


        case "about":

            showAbout();

            break;


        case "register":

            showRegister();

            break;


        case "login":

            showLogin();

            break;


        case "post":

            showPostPage();

            break;


        default:

            location.hash =
                "home";

            break;
    }
}


// ============================================================
// LOGOUT
// ============================================================

document
    .getElementById(
        "logoutLink"
    )
    .addEventListener(
        "click",
        async event => {

            event.preventDefault();

            await logout();

        }
    );


// ============================================================
// AUTH LISTENER
// ============================================================

supabaseClient
    .auth
    .onAuthStateChange(
        async function(
            event,
            session
        ) {

            currentUser =
                session?.user ||
                null;


            await updateAuthState();

        }
    );


// ============================================================
// HASH CHANGES
// ============================================================

window.addEventListener(
    "hashchange",
    async function() {

        await renderRoute();

    }
);


// ============================================================
// COUNTER
// ============================================================

function updateCounter() {

    let count =
        localStorage.getItem(
            "redArchiveCounter"
        );


    if (!count) {

        count =
            String(
                Math.floor(
                    Math.random() * 90000
                ) + 10000
            );

    } else {

        count =
            String(
                Number(count) + 1
            );
    }


    localStorage.setItem(
        "redArchiveCounter",
        count
    );


    document.getElementById(
        "visitorCounter"
    ).textContent =
        count.padStart(
            6,
            "0"
        );
}


// ============================================================
// START
// ============================================================

async function startApp() {

    updateCounter();

    await updateAuthState();

    await renderRoute();
}


startApp();

</script>
